<h1>Self-assessment</h1>
<p class="explainer-assessment-nojs">The self-assessment needs JavaScript. <a href="../../../en/genitiv-n-deklination/">Genitive Case and Weak Masculine Nouns</a></p>
<template class="explainer-assessment-template">
<div class="explainer-assessment" hidden>
<div class="explainer-assessment-intro">
<p>With this self-assessment, 4 tasks give you an overview of what you know already. It asks about every page.</p>
<p>The app does not tell you for each task whether it is right. Only at the end do you see for each page asked whether you know it already. What you leave empty counts as not known.</p>
<p class="explainer-assessment-privacy">Your result stays on this device only. A new start replaces it.</p>
<p><button type="button" class="explainer-assessment-begin">Let's go</button></p>
</div>
<section class="explainer-assessment-step" data-step="0" aria-labelledby="teil-1" hidden>
<h2 id="teil-1" tabindex="-1">Page 1 of 1</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Task 1</p><div class="explainer-language-text"><p>Fill in the genitive article and noun (watch for -(e)s on masculine/neuter nouns).</p></div><div class="explainer-language-live" hidden></div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Task 2</p><div class="question" id="frage-a2" data-id="a2" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">How does Peter correctly refer to the room of his friend (*mein Freund*, m)?</legend>
<label class="question-option"><input type="radio" name="frage-a2" value="0"> <span>Das ist das Zimmer meines Freundes.</span></label>
<label class="question-option"><input type="radio" name="frage-a2" value="1"> <span>Das ist das Zimmer meinem Freund.</span></label>
<label class="question-option"><input type="radio" name="frage-a2" value="2"> <span>Das ist das Zimmer meines Freund.</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Das ist das Zimmer meines Freundes.</strong> <span class="question-badge question-badge-right">right answer</span></p><p>Correct! Possessive *meines* (masculine genitive) + noun *Freundes* (+ *-es*).</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Das ist das Zimmer meinem Freund.</strong></p><p>*meinem* is dative. Direct possession without a preposition uses the genitive: *meines Freundes*.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Das ist das Zimmer meines Freund.</strong></p><p>The masculine noun is missing its genitive *-es* ending: *meines Freundes*.</p></li>
</ul>
<p class="question-explanation">In the genitive, both the determiner (*des/meines*) and masculine/neuter nouns take *-(e)s*.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Task 3</p><div class="explainer-language-text"><p>Fill in the right form of each weak masculine noun.</p></div><div class="explainer-language-live" hidden></div></li>
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Task 4</p><div class="question" id="frage-a4" data-id="a4" data-type="multiple-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Which statements about the n-declension are true?</legend>
<label class="question-option"><input type="checkbox" name="frage-a4" value="0"> <span>It only applies to certain masculine nouns.</span></label>
<label class="question-option"><input type="checkbox" name="frage-a4" value="1"> <span>Only the nominative singular keeps the base form without -n/-en.</span></label>
<label class="question-option"><input type="checkbox" name="frage-a4" value="2"> <span>Every masculine noun adds -n in the accusative.</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>It only applies to certain masculine nouns.</strong> <span class="question-badge question-badge-right">right answer</span></p><p>Correct! Feminine and neuter nouns (aside from the rare special case *das Herz*) are not part of it.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>Only the nominative singular keeps the base form without -n/-en.</strong> <span class="question-badge question-badge-right">right answer</span></p><p>Correct! Accusative, dative, genitive, and plural all take *-n* or *-en*.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Every masculine noun adds -n in the accusative.</strong></p><p>No, regular masculine nouns like *der Tisch* or *der Lehrer* stay unchanged in the accusative (*den Tisch, den Lehrer*).</p></li>
</ul>
<p class="question-explanation">The n-declension covers a specific group of masculine nouns and adds *-n/-en* in every case except nominative singular.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
</ol>
<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-finish">Evaluate</button></p>
</section>
