<h1>Self-assessment</h1>
<p class="explainer-assessment-nojs">The self-assessment needs JavaScript. <a href="../../../en/genus-plural-negation/">Gender, Plurals and Negation</a></p>
<template class="explainer-assessment-template">
<div class="explainer-assessment" hidden>
<div class="explainer-assessment-intro">
<p>With this self-assessment, 6 tasks give you an overview of what you know already. It asks about every page.</p>
<p>The app does not tell you for each task whether it is right. Only at the end do you see for each page asked whether you know it already. What you leave empty counts as not known.</p>
<p class="explainer-assessment-privacy">Your result stays on this device only. A new start replaces it.</p>
<p><button type="button" class="explainer-assessment-begin">Let's go</button></p>
</div>
<section class="explainer-assessment-step" data-step="0" aria-labelledby="teil-1" hidden>
<h2 id="teil-1" tabindex="-1">Page 1 of 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Task 1</p><div class="explainer-language-text"><p>Type the matching nominative article (<em>ein, eine, der, die, das</em>).</p></div><div class="explainer-language-live" hidden></div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Task 2</p><div class="explainer-language-text"><p>Type the matching plural form with the article die in each gap.</p></div><div class="explainer-language-live" hidden></div></li>
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Task 3</p><div class="explainer-language-text"><p>Type <em>kein</em>, <em>keine</em>, or <em>nicht</em> in each gap.</p></div><div class="explainer-language-live" hidden></div></li>
</ol>
<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-next">Next</button></p>
</section>
<section class="explainer-assessment-step" data-step="1" aria-labelledby="teil-2" hidden>
<h2 id="teil-2" tabindex="-1">Page 2 of 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Task 4</p><div class="question" id="frage-a4" data-id="a4" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Peter buys a bread roll in Lindenberg and sees a newspaper. Which pair is correct?</legend>
<label class="question-option"><input type="radio" name="frage-a4" value="0"> <span>das Brötchen (n) · die Zeitung (f)</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="1"> <span>der Brötchen (m) · die Zeitung (f)</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="2"> <span>das Brötchen (n) · der Zeitung (m)</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>das Brötchen (n) · die Zeitung (f)</strong> <span class="question-badge question-badge-right">right answer</span></p><p>Exactly! Nouns ending in *-chen* are always neuter (*das*), and nouns ending in *-ung* are always feminine (*die*).</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>der Brötchen (m) · die Zeitung (f)</strong></p><p>*die Zeitung* is right, but *-chen* always makes nouns neuter: *das Brötchen*.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>das Brötchen (n) · der Zeitung (m)</strong></p><p>*das Brötchen* is right, but nouns ending in *-ung* are always feminine: *die Zeitung*.</p></li>
</ul>
<p class="question-explanation">Endings like *-chen* (neuter) and *-ung* (feminine) reliably show a noun's gender.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a5"><p class="explainer-assessment-label">Task 5</p><div class="question" id="frage-a5" data-id="a5" data-type="multiple-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Which of these nouns take no new ending in the plural (— pattern)?</legend>
<label class="question-option"><input type="checkbox" name="frage-a5" value="0"> <span>das Brötchen → die Brötchen</span></label>
<label class="question-option"><input type="checkbox" name="frage-a5" value="1"> <span>der Lehrer → die Lehrer</span></label>
<label class="question-option"><input type="checkbox" name="frage-a5" value="2"> <span>die Schule → die Schulen</span></label>
<label class="question-option"><input type="checkbox" name="frage-a5" value="3"> <span>das Buch → die Bücher</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>das Brötchen → die Brötchen</strong> <span class="question-badge question-badge-right">right answer</span></p><p>Correct! Nouns ending in *-chen* stay unchanged in the plural.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>der Lehrer → die Lehrer</strong> <span class="question-badge question-badge-right">right answer</span></p><p>Correct! Many nouns ending in *-er* take no extra ending in the plural.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>die Schule → die Schulen</strong></p><p>*die Schule* adds *-n*: *die Schulen*.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>das Buch → die Bücher</strong></p><p>*das Buch* adds an umlaut and *-er*: *die Bücher*.</p></li>
</ul>
<p class="question-explanation">Nouns ending in *-er, -el, -en, -chen* often take no plural ending (*die Lehrer, die Brötchen, die Zimmer*).</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a6"><p class="explainer-assessment-label">Task 6</p><div class="question" id="frage-a6" data-id="a6" data-type="ordering">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Put the words in the right order: *Peter has no homework today.*</legend>
<p class="question-hint">Give each entry its place: 1 for the first.</p>
<ul class="question-pairs">
<li><label><span>keine</span> <select name="frage-a6-3" data-item="3"><option value="">please choose</option><option value="0">Place 1</option><option value="1">Place 2</option><option value="2">Place 3</option><option value="3">Place 4</option><option value="4">Place 5</option></select></label></li>
<li><label><span>Hausaufgaben.</span> <select name="frage-a6-4" data-item="4"><option value="">please choose</option><option value="0">Place 1</option><option value="1">Place 2</option><option value="2">Place 3</option><option value="3">Place 4</option><option value="4">Place 5</option></select></label></li>
<li><label><span>heute</span> <select name="frage-a6-2" data-item="2"><option value="">please choose</option><option value="0">Place 1</option><option value="1">Place 2</option><option value="2">Place 3</option><option value="3">Place 4</option><option value="4">Place 5</option></select></label></li>
<li><label><span>hat</span> <select name="frage-a6-1" data-item="1"><option value="">please choose</option><option value="0">Place 1</option><option value="1">Place 2</option><option value="2">Place 3</option><option value="3">Place 4</option><option value="4">Place 5</option></select></label></li>
<li><label><span>Peter</span> <select name="frage-a6-0" data-item="0"><option value="">please choose</option><option value="0">Place 1</option><option value="1">Place 2</option><option value="2">Place 3</option><option value="3">Place 4</option><option value="4">Place 5</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Right answer:</strong> 1. Peter, 2. hat, 3. heute, 4. keine, 5. Hausaufgaben.</p>
<p class="question-explanation">*keine* stands directly before the plural noun *Hausaufgaben*, while the verb *hat* stays in position 2.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
</ol>
