<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Task 4</p><div class="question" id="frage-a4" data-id="a4" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Peter buys a bread roll in Lindenberg and sees a newspaper. Which pair is correct?</legend>
<label class="question-option"><input type="radio" name="frage-a4" value="0"> <span>das Brötchen (n) · die Zeitung (f)</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="1"> <span>der Brötchen (m) · die Zeitung (f)</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="2"> <span>das Brötchen (n) · der Zeitung (m)</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>das Brötchen (n) · die Zeitung (f)</strong> <span class="question-badge question-badge-right">right answer</span></p><p>Exactly! Nouns ending in *-chen* are always neuter (*das*), and nouns ending in *-ung* are always feminine (*die*).</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>der Brötchen (m) · die Zeitung (f)</strong></p><p>*die Zeitung* is right, but *-chen* always makes nouns neuter: *das Brötchen*.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>das Brötchen (n) · der Zeitung (m)</strong></p><p>*das Brötchen* is right, but nouns ending in *-ung* are always feminine: *die Zeitung*.</p></li>
</ul>
<p class="question-explanation">Endings like *-chen* (neuter) and *-ung* (feminine) reliably show a noun's gender.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a5"><p class="explainer-assessment-label">Task 5</p><div class="question" id="frage-a5" data-id="a5" data-type="multiple-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Which of these nouns take no new ending in the plural (— pattern)?</legend>
<label class="question-option"><input type="checkbox" name="frage-a5" value="0"> <span>das Brötchen → die Brötchen</span></label>
<label class="question-option"><input type="checkbox" name="frage-a5" value="1"> <span>der Lehrer → die Lehrer</span></label>
<label class="question-option"><input type="checkbox" name="frage-a5" value="2"> <span>die Schule → die Schulen</span></label>
<label class="question-option"><input type="checkbox" name="frage-a5" value="3"> <span>das Buch → die Bücher</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>das Brötchen → die Brötchen</strong> <span class="question-badge question-badge-right">right answer</span></p><p>Correct! Nouns ending in *-chen* stay unchanged in the plural.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>der Lehrer → die Lehrer</strong> <span class="question-badge question-badge-right">right answer</span></p><p>Correct! Many nouns ending in *-er* take no extra ending in the plural.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>die Schule → die Schulen</strong></p><p>*die Schule* adds *-n*: *die Schulen*.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>das Buch → die Bücher</strong></p><p>*das Buch* adds an umlaut and *-er*: *die Bücher*.</p></li>
</ul>
<p class="question-explanation">Nouns ending in *-er, -el, -en, -chen* often take no plural ending (*die Lehrer, die Brötchen, die Zimmer*).</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a6"><p class="explainer-assessment-label">Task 6</p><div class="question" id="frage-a6" data-id="a6" data-type="ordering">

<li><label><span>hat</span> <select name="frage-a6-1" data-item="1"><option value="">please choose</option><option value="0">Place 1</option><option value="1">Place 2</option><option value="2">Place 3</option><option value="3">Place 4</option><option value="4">Place 5</option></select></label></li>
<li><label><span>Peter</span> <select name="frage-a6-0" data-item="0"><option value="">please choose</option><option value="0">Place 1</option><option value="1">Place 2</option><option value="2">Place 3</option><option value="3">Place 4</option><option value="4">Place 5</option></select></label></li>

<h2 id="teil-4" tabindex="-1">Page 4 of 7</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a10"><p class="explainer-assessment-label">Task 10</p><div class="question" id="frage-a10" data-id="a10" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">In the sentence *Den Stuhl braucht Peter heute* — what is the nominative subject?</legend>
<label class="question-option"><input type="radio" name="frage-a10" value="0"> <span>Peter</span></label>
<label class="question-option"><input type="radio" name="frage-a10" value="1"> <span>Den Stuhl</span></label>
<label class="question-option"><input type="radio" name="frage-a10" value="2"> <span>heute</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Peter</strong> <span class="question-badge question-badge-right">right answer</span></p><p>Correct! Even though *Den Stuhl* stands first, *den* marks it as accusative. *Peter* is the subject.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Den Stuhl</strong></p><p>*den* marks the accusative case. In German, cases show grammatical role — not always word order!</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>heute</strong></p><p>*heute* is a time adverb, not a subject.</p></li>
</ul>
<p class="question-explanation">The article *den* clearly marks the accusative — even when the object stands before the verb.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a11"><p class="explainer-assessment-label">Task 11</p><div class="question" id="frage-a11" data-id="a11" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Peter is looking for his key (*der Schlüssel*). Why does he say *Ich finde ihn* instead of *Ich finde es*?</legend>
<label class="question-option"><input type="radio" name="frage-a11" value="0"> <span>Because the pronoun matches the noun's gender (*der*, masculine) — even for things.</span></label>
<label class="question-option"><input type="radio" name="frage-a11" value="1"> <span>Because *es* can never be used in the accusative in German.</span></label>
<label class="question-option"><input type="radio" name="frage-a11" value="2"> <span>Because *finden* always requires the pronoun *ihn*.</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Because the pronoun matches the noun's gender (*der*, masculine) — even for things.</strong> <span class="question-badge question-badge-right">right answer</span></p><p>Exactly! In German, pronouns follow *der/die/das*, not whether something is a person or a thing.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Because *es* can never be used in the accusative in German.</strong></p><p>For neuter nouns like *das Buch*, you do use *es*: *Ich lese es.*</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Because *finden* always requires the pronoun *ihn*.</strong></p><p>*finden* takes the accusative, but the pronoun depends on the noun (*die Tasche → sie*, *das Heft → es*).</p></li>
</ul>
<p class="question-explanation">Things keep their grammatical gender in pronouns too: *der → ihn*, *die → sie*, *das → es*.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a12"><p class="explainer-assessment-label">Task 12</p><div class="question" id="frage-a12" data-id="a12" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Lukas and Mina are looking for their football (*der Ball*, m). How does Peter ask correctly?</legend>
<label class="question-option"><input type="radio" name="frage-a12" value="0"> <span>Sucht ihr euren Ball?</span></label>
<label class="question-option"><input type="radio" name="frage-a12" value="1"> <span>Sucht ihr eueren Ball?</span></label>
<label class="question-option"><input type="radio" name="frage-a12" value="2"> <span>Sucht ihr euer Ball?</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Sucht ihr euren Ball?</strong> <span class="question-badge question-badge-right">right answer</span></p><p>Correct! Masculine accusative needs *-en*, and *euer* drops its second *e* → *euren*.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Sucht ihr eueren Ball?</strong></p><p>Whenever *euer* takes an ending, the second *e* drops: *euren Ball*.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Sucht ihr euer Ball?</strong></p><p>*der Ball* is masculine accusative and needs the *-en* ending: *euren Ball*.</p></li>
</ul>
<p class="question-explanation">With an ending, *euer* drops its second *e*: *eure* (f/pl), *euren* (m acc.).</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
</ol>

<li class="explainer-assessment-item" data-key="a20"><p class="explainer-assessment-label">Task 20</p><div class="explainer-language-text"><p>Fill in the genitive article and noun (watch for -(e)s on masculine/neuter nouns).</p></div><div class="explainer-language-live" hidden></div></li>
<li class="explainer-assessment-item" data-key="a21"><p class="explainer-assessment-label">Task 21</p><div class="question" id="frage-a21" data-id="a21" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">How does Peter correctly refer to the room of his friend (*mein Freund*, m)?</legend>
<label class="question-option"><input type="radio" name="frage-a21" value="0"> <span>Das ist das Zimmer meines Freundes.</span></label>
<label class="question-option"><input type="radio" name="frage-a21" value="1"> <span>Das ist das Zimmer meinem Freund.</span></label>
<label class="question-option"><input type="radio" name="frage-a21" value="2"> <span>Das ist das Zimmer meines Freund.</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Das ist das Zimmer meines Freundes.</strong> <span class="question-badge question-badge-right">right answer</span></p><p>Correct! Possessive *meines* (masculine genitive) + noun *Freundes* (+ *-es*).</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Das ist das Zimmer meinem Freund.</strong></p><p>*meinem* is dative. Direct possession without a preposition uses the genitive: *meines Freundes*.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Das ist das Zimmer meines Freund.</strong></p><p>The masculine noun is missing its genitive *-es* ending: *meines Freundes*.</p></li>
</ul>
<p class="question-explanation">In the genitive, both the determiner (*des/meines*) and masculine/neuter nouns take *-(e)s*.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a22"><p class="explainer-assessment-label">Task 22</p><div class="explainer-language-text"><p>Fill in the right form of each weak masculine noun.</p></div><div class="explainer-language-live" hidden></div></li>
<li class="explainer-assessment-item" data-key="a23"><p class="explainer-assessment-label">Task 23</p><div class="question" id="frage-a23" data-id="a23" data-type="multiple-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Which statements about the n-declension are true?</legend>
<label class="question-option"><input type="checkbox" name="frage-a23" value="0"> <span>It only applies to certain masculine nouns.</span></label>
<label class="question-option"><input type="checkbox" name="frage-a23" value="1"> <span>Only the nominative singular keeps the base form without -n/-en.</span></label>
<label class="question-option"><input type="checkbox" name="frage-a23" value="2"> <span>Every masculine noun adds -n in the accusative.</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>It only applies to certain masculine nouns.</strong> <span class="question-badge question-badge-right">right answer</span></p><p>Correct! Feminine and neuter nouns (aside from the rare special case *das Herz*) are not part of it.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>Only the nominative singular keeps the base form without -n/-en.</strong> <span class="question-badge question-badge-right">right answer</span></p><p>Correct! Accusative, dative, genitive, and plural all take *-n* or *-en*.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Every masculine noun adds -n in the accusative.</strong></p><p>No, regular masculine nouns like *der Tisch* or *der Lehrer* stay unchanged in the accusative (*den Tisch, den Lehrer*).</p></li>
</ul>
<p class="question-explanation">The n-declension covers a specific group of masculine nouns and adds *-n/-en* in every case except nominative singular.</p>
