<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 278" role="img" aria-label="Stand-in Cards for Accusative and Dative Personal Pronouns">
  <rect width="340" height="278" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="170" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Stellvertreter-Karten · Personalpronomen</text>

  <!-- Row 1: ich, du, er (m) -->
  <rect x="10" y="36" width="102" height="64" rx="7" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="61" y="54" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#0f172a">ich</text>
  <text x="61" y="73" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1e3a8a">Akk: mich</text>
  <text x="61" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#78350f">Dat: mir</text>

  <rect x="119" y="36" width="102" height="64" rx="7" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="170" y="54" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#0f172a">du</text>
  <text x="170" y="73" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1e3a8a">Akk: dich</text>
  <text x="170" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#78350f">Dat: dir</text>

  <rect x="228" y="36" width="102" height="64" rx="7" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="279" y="54" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#1e3a8a">er (m)</text>
  <text x="279" y="73" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1e3a8a">Akk: ihn</text>
  <text x="279" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#78350f">Dat: ihm</text>

  <!-- Row 2: sie (f), es (n), wir -->
  <rect x="10" y="108" width="102" height="64" rx="7" fill="#ffe4e6" stroke="#be123c" stroke-width="2"/>
  <text x="61" y="126" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#9f1239">sie (f)</text>
  <text x="61" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1e3a8a">Akk: sie</text>
  <text x="61" y="162" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#78350f">Dat: ihr</text>

  <rect x="119" y="108" width="102" height="64" rx="7" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="170" y="126" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#14532d">es (n)</text>
  <text x="170" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1e3a8a">Akk: es</text>
  <text x="170" y="162" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#78350f">Dat: ihm</text>

  <rect x="228" y="108" width="102" height="64" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="279" y="126" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#78350f">wir</text>
  <text x="279" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1e3a8a">Akk: uns</text>
  <text x="279" y="162" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#78350f">Dat: uns</text>

  <!-- Row 3: ihr, sie / Sie -->
  <rect x="34" y="180" width="124" height="64" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="96" y="198" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#78350f">ihr (pl)</text>
  <text x="96" y="217" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1e3a8a">Akk: euch</text>
  <text x="96" y="234" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#78350f">Dat: euch</text>

  <rect x="172" y="180" width="144" height="64" rx="7" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="244" y="198" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#78350f">sie (pl) / Sie</text>
  <text x="244" y="217" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1e3a8a">Akk: sie / Sie</text>
  <text x="244" y="234" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#78350f">Dat: ihnen / Ihnen</text>
</svg>
