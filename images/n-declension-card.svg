<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 264" role="img" aria-label="Weak Masculine Nouns (n-declension) Pattern Card">
  <rect width="340" height="264" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="12" y="12" width="316" height="30" rx="6" fill="#1d4ed8"/>
  <text x="170" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">n-Deklination · Musterkarte (Maskulinum)</text>

  <!-- 2x2 Grid of Cases (model nouns: der Junge, der Löwe) -->
  <!-- Nominativ (no -n) -->
  <rect x="12" y="50" width="153" height="86" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="88" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#334155">Nominativ (Sg.)</text>
  <text x="88" y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13.5" font-weight="800" fill="#1e3a8a">der Junge</text>
  <text x="88" y="111" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">der Löwe</text>
  <text x="88" y="128" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#334155">Grundform (ohne -n)</text>

  <!-- Akkusativ -->
  <rect x="175" y="50" width="153" height="86" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="251" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1e3a8a">Akkusativ</text>
  <text x="251" y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13.5" font-weight="800" fill="#1e3a8a">den Jungen</text>
  <text x="251" y="111" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">den Löwen</text>
  <text x="251" y="128" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#9f1239">+ -n / -en</text>

  <!-- Dativ -->
  <rect x="12" y="144" width="153" height="86" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="88" y="164" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#78350f">Dativ</text>
  <text x="88" y="186" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13.5" font-weight="800" fill="#78350f">dem Jungen</text>
  <text x="88" y="205" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#78350f">dem Löwen</text>
  <text x="88" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#9f1239">+ -n / -en</text>

  <!-- Genitiv -->
  <rect x="175" y="144" width="153" height="86" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="251" y="164" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#4c1d95">Genitiv</text>
  <text x="251" y="186" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13.5" font-weight="800" fill="#4c1d95">des Jungen</text>
  <text x="251" y="205" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#4c1d95">des Löwen</text>
  <text x="251" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#9f1239">+ -n / -en</text>
</svg>
