# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title:
  de: "Genitiv und Genitivpräpositionen"
  en: "Genitive Case & Prepositions"
description:
  de: "Den Genitiv (des, der, eines, einer) für Besitz und nach wegen, trotz, während und statt verwenden."
  en: "Use the genitive case (des, der, eines, einer) for possession and after wegen, trotz, während, and statt."
competencies: [genitiv-artikel]
blocks:
  - type: section
    id: genitiv-komplett
    title:
      de: "Wessen Fahrrad ist das? — Zeile 4 macht die Tabelle komplett"
      en: "Whose Bike Is That? — Row 4 Completes the Table"
    blocks:
      - type: text
        text:
          de: "Mit dem **Genitiv** (Wessen?) ist unsere 4-Fälle-Farbtabelle komplett! Der Genitiv zeigt **Besitz und Zugehörigkeit** (*das Fahrrad **des Bruders***) und steht nach wichtigen Präpositionen: **wegen, trotz, während, statt**."
          en: "With the **genitive** (whose?), our 4-Case Color Table is complete! The genitive expresses **possession and belonging** (*das Fahrrad **des Bruders***) and follows key prepositions: **wegen, trotz, während, statt**."
      - type: figure
        image: images/case-table-ch4.svg
        source:
          de: "Eigene Zeichnung"
          en: "Own drawing"
        licence: CC0-1.0
        alt:
          de: "Komplette 4-Fälle-Farbtabelle mit Nominativ, Akkusativ, Dativ und neu der Genitiv-Zeile: des/eines + -(e)s (m/n), der/einer (f), der/keiner (pl)."
          en: "Complete 4-Case Color Table with Nominative, Accusative, Dative, and the new Genitive row: des/eines + -(e)s (m/n), der/einer (f), der/keiner (pl)."
        caption:
          de: "Zeile 4 (Genitiv): Maskulin und Neutrum tragen des/eines + -(e)s am Nomen; Feminin und Plural nehmen der/einer/keiner."
          en: "Row 4 (Genitive): Masculine and neuter take des/eines + -(e)s on the noun; feminine and plural take der/einer/keiner."
      - type: note
        title:
          de: "Wann -s, wann -es — und was gilt bei Namen?"
          en: "When -s vs. -es — and What About Names?"
        blocks:
          - type: text
            text:
              de: "Maskuline und neutrale Nomen erhalten meist **-s** (*des Lehrers, des Regens*). Kurze einsilbige Nomen oder Wörter auf *s, ß, x, z* erhalten **-es** (*des Tages, des Hauses*). Eigennamen stehen mit **-s** vor dem Nomen: *Peters Zimmer, Minas Gitarre*."
              en: "Masculine and neuter nouns usually add **-s** (*des Lehrers, des Regens*). Short one-syllable nouns or words ending in *s, ß, x, z* add **-es** (*des Tages, des Hauses*). Proper names take **-s** before the noun: *Peters Zimmer, Minas Gitarre*."
      - type: example
        title:
          de: "Die vier Genitivpräpositionen in Lindenberg"
          en: "The Four Genitive Prepositions in Lindenberg"
        blocks:
          - type: text
            text:
              de: "**wegen** (because of): *Wegen **des Regens** fährt Peter mit dem Bus.* · **trotz** (despite): *Trotz **der Kälte** trainiert Mina draußen.* · **während** (during): *Während **des Unterrichts** macht Peter Notizen.* · **statt** (instead of): *Statt **eines Buches** kauft er ein Spiel.*"
              en: "**wegen** (because of): *Wegen **des Regens** fährt Peter mit dem Bus.* · **trotz** (despite): *Trotz **der Kälte** trainiert Mina draußen.* · **während** (during): *Während **des Unterrichts** macht Peter Notizen.* · **statt** (instead of): *Statt **eines Buches** kauft er ein Spiel.*"
  - type: section
    id: uebung
    title:
      de: "Übung"
      en: "Practice"
    blocks:
      - type: matching
        id: genitiv-praepositionen-zuordnen
        text:
          de: "Ordne jeder Genitivpräposition ihre englische Bedeutung zu."
          en: "Match each genitive preposition to its English meaning."
        pairs:
          - left: { de: "wegen", en: "wegen" }
            right: { de: "because of", en: "because of" }
          - left: { de: "trotz", en: "trotz" }
            right: { de: "despite", en: "despite" }
          - left: { de: "während", en: "während" }
            right: { de: "during", en: "during" }
          - left: { de: "statt", en: "statt" }
            right: { de: "instead of", en: "instead of" }
        explanation:
          de: "*wegen, trotz, während* und *statt* gehören zu den wichtigsten Präpositionen mit Genitiv."
          en: "*wegen, trotz, während*, and *statt* are the four core prepositions that take the genitive."
      - type: language-task
        id: genitiv-luecken
        languages: { source: en, target: de }
        mode: gap
        form: { case: hint, punctuation: ok }
        task:
          de: "Ergänze Artikel und Nomen im Genitiv (achte auf -(e)s bei Maskulin/Neutrum)."
          en: "Fill in the genitive article and noun (watch for -(e)s on masculine/neuter nouns)."
        items:
          - source: "Because of the rain (der Regen), we stay at home."
            target: "Wegen [des Regens] bleiben wir zu Hause."
            mistakes:
              - answer: "des Regen"
                message:
                  de: "Im Genitiv braucht das maskuline Nomen *Regen* die Endung *-s*: *des Regens*."
                  en: "In the genitive, masculine *Regen* needs the *-s* ending: *des Regens*."
          - source: "That is the jacket of the sister (die Schwester)."
            target: "Das ist die Jacke [der Schwester]."
            mistakes:
              - answer: "der Schwesters"
                message:
                  de: "Feminine Nomen bekommen im Genitiv **kein** *-s*: *der Schwester*."
                  en: "Feminine nouns do **not** take *-s* in the genitive: *der Schwester*."
          - source: "During the weekend (das Wochenende), Peter visits Nadia."
            target: "Während [des Wochenendes] besucht Peter Nadia."
          - source: "Despite the cold (die Kälte), Lukas rides his bike."
            target: "Trotz [der Kälte] fährt Lukas Fahrrad."
        explanation:
          de: "Maskulin und Neutrum bilden den Genitiv mit *des/eines* + *-(e)s* am Nomen; Feminin und Plural mit *der/einer/keiner* ohne *-s*."
          en: "Masculine and neuter form the genitive with *des/eines* + *-(e)s* on the noun; feminine and plural use *der/einer/keiner* with no *-s*."
      - type: single-choice
        id: genitiv-besitz-check
        text:
          de: "Wie nennt Peter richtig das Zimmer seines Freundes (*mein Freund*, m)?"
          en: "How does Peter correctly refer to the room of his friend (*mein Freund*, m)?"
        options:
          - text:
              de: "Das ist das Zimmer meines Freundes."
              en: "Das ist das Zimmer meines Freundes."
            correct: true
            info:
              de: "Richtig! Possessivartikel *meines* (Genitiv m) + Nomen *Freundes* (+ *-es*)."
              en: "Correct! Possessive *meines* (masculine genitive) + noun *Freundes* (+ *-es*)."
          - text:
              de: "Das ist das Zimmer meinem Freund."
              en: "Das ist das Zimmer meinem Freund."
            correct: false
            info:
              de: "*meinem* ist Dativ. Für direkten Besitz ohne Präposition braucht man den Genitiv: *meines Freundes*."
              en: "*meinem* is dative. Direct possession without a preposition uses the genitive: *meines Freundes*."
          - text:
              de: "Das ist das Zimmer meines Freund."
              en: "Das ist das Zimmer meines Freund."
            correct: false
            info:
              de: "Am maskulinen Nomen fehlt die Genitiv-Endung *-es*: *meines Freundes*."
              en: "The masculine noun is missing its genitive *-es* ending: *meines Freundes*."
        explanation:
          de: "Im Genitiv bekommen sowohl Artikel/Possessivartikel (*des/meines*) als auch maskuline und neutrale Nomen ein *-(e)s*."
          en: "In the genitive, both the determiner (*des/meines*) and masculine/neuter nouns take *-(e)s*."
      - type: language-task
        id: genitiv-praep-wahl
        languages: { source: en, target: de }
        mode: choice
        task:
          de: "Wähle die richtige Genitiv-Form nach der Präposition."
          en: "Choose the right genitive form after each preposition."
        items:
          - source: "Instead of a game (ein Spiel, n), Peter buys a book."
            target: "Statt [eines Spiels] kauft Peter ein Buch."
            distractors: [[einem Spiel, ein Spiel]]
          - source: "During the lesson (der Unterricht, m), everyone listens."
            target: "Während [des Unterrichts] hören alle zu."
            distractors: [[dem Unterricht, den Unterricht]]
          - source: "Because of the holidays (die Ferien, pl.), the school is closed."
            target: "Wegen [der Ferien] ist die Schule geschlossen."
            distractors: [[den Ferien, die Ferien]]
        explanation:
          de: "Nach *statt, während, wegen, trotz* steht der Genitiv: *des/eines + -(e)s* (m/n) und *der* (f/pl)."
          en: "After *statt, während, wegen, trotz*, use the genitive: *des/eines + -(e)s* (m/n) and *der* (f/pl)."
