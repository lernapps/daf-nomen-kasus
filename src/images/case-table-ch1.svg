  <text x="72" y="41" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Kasus / Case</text>

  <rect x="136" y="16" width="116" height="40" rx="6" fill="#1d4ed8"/>
