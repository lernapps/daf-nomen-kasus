<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 176" role="img" aria-label="4-Case Color Table: Nominative">
  <rect width="340" height="176" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <text x="170" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">4-Fälle-Farbtabelle · Nominativ (Wer? / Was?)</text>

  <!-- 4 Column Headers -->
  <rect x="10" y="34" width="76" height="26" rx="5" fill="#1d4ed8"/>
  <text x="48" y="51" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">m (Mask.)</text>

  <rect x="92" y="34" width="76" height="26" rx="5" fill="#be123c"/>
  <text x="130" y="51" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">f (Fem.)</text>

  <rect x="174" y="34" width="76" height="26" rx="5" fill="#15803d"/>
  <text x="212" y="51" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">n (Neutr.)</text>

  <rect x="256" y="34" width="74" height="26" rx="5" fill="#b45309"/>
  <text x="293" y="51" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">pl (Plural)</text>

  <!-- Row 1: Nominativ -->
  <rect x="10" y="66" width="76" height="78" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="48" y="88" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#1e3a8a">der / ein</text>
  <text x="48" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1e3a8a">kein</text>
  <text x="48" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#334155">der Tisch</text>

  <rect x="92" y="66" width="76" height="78" rx="6" fill="#ffe4e6" stroke="#be123c" stroke-width="2"/>
  <text x="130" y="88" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#9f1239">die / eine</text>
  <text x="130" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#9f1239">keine</text>
  <text x="130" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#334155">die Lampe</text>

  <rect x="174" y="66" width="76" height="78" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="212" y="88" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#14532d">das / ein</text>
  <text x="212" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#14532d">kein</text>
  <text x="212" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#334155">das Bett</text>

  <rect x="256" y="66" width="74" height="78" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="293" y="88" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#78350f">die / —</text>
  <text x="293" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#78350f">keine</text>
  <text x="293" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#334155">die Bücher</text>
</svg>
