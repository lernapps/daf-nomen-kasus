<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 415" role="img" aria-label="Complete 4-Case Color Table: Nominative, Accusative, Dative, and Genitive">
  <rect width="640" height="415" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Headers -->
  <rect x="16" y="16" width="112" height="36" rx="6" fill="#334155"/>
  <text x="72" y="39" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Kasus / Case</text>
  <rect x="136" y="16" width="116" height="36" rx="6" fill="#1d4ed8"/>
  <text x="194" y="39" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">m (Mask.)</text>
  <rect x="260" y="16" width="116" height="36" rx="6" fill="#be123c"/>
  <text x="318" y="39" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">f (Fem.)</text>
  <rect x="384" y="16" width="116" height="36" rx="6" fill="#15803d"/>
  <text x="442" y="39" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">n (Neutr.)</text>
  <rect x="508" y="16" width="116" height="36" rx="6" fill="#b45309"/>
  <text x="566" y="39" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">pl (Plural)</text>

  <!-- Row 1: Nominativ -->
  <rect x="16" y="62" width="112" height="66" rx="6" fill="#e2e8f0"/>
  <text x="72" y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Nominativ</text>
  <text x="72" y="111" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Wer? / Was?</text>

  <rect x="136" y="62" width="116" height="66" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="194" y="99" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e3a8a">der / ein</text>

  <rect x="260" y="62" width="116" height="66" rx="6" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5"/>
  <text x="318" y="99" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#881337">die / eine</text>

  <rect x="384" y="62" width="116" height="66" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="442" y="99" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#14532d">das / ein</text>

  <rect x="508" y="62" width="116" height="66" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="566" y="99" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#78350f">die / keine</text>

  <!-- Row 2: Akkusativ -->
  <rect x="16" y="138" width="112" height="66" rx="6" fill="#e2e8f0"/>
  <text x="72" y="168" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Akkusativ</text>
  <text x="72" y="187" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Wen? / Was?</text>

  <rect x="136" y="138" width="116" height="66" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="194" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e3a8a">den / einen</text>

  <rect x="260" y="138" width="116" height="66" rx="6" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5"/>
  <text x="318" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#881337">die / eine</text>

  <rect x="384" y="138" width="116" height="66" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="442" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#14532d">das / ein</text>

  <rect x="508" y="138" width="116" height="66" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="566" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#78350f">die / keine</text>

  <!-- Row 3: Dativ -->
  <rect x="16" y="214" width="112" height="66" rx="6" fill="#e2e8f0"/>
  <text x="72" y="244" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Dativ</text>
  <text x="72" y="263" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Wem?</text>

  <rect x="136" y="214" width="116" height="66" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="194" y="251" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e3a8a">dem / einem</text>

  <rect x="260" y="214" width="116" height="66" rx="6" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5"/>
  <text x="318" y="251" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#881337">der / einer</text>

  <rect x="384" y="214" width="116" height="66" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="442" y="251" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#14532d">dem / einem</text>

  <rect x="508" y="214" width="116" height="66" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="566" y="244" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#78350f">den / keinen</text>
  <text x="566" y="264" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#92400e">+ -n</text>

  <!-- Row 4: Genitiv (NEW) -->
  <rect x="16" y="290" width="112" height="108" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="2.5"/>
  <text x="72" y="330" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#4c1d95">Genitiv</text>
  <text x="72" y="352" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b21b6">Wessen?</text>
  <text x="72" y="376" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#b91c1c">★ NEW</text>

  <rect x="136" y="290" width="116" height="108" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="194" y="328" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#1e3a8a">des / eines</text>
  <text x="194" y="352" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">keines</text>
  <text x="194" y="378" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">Nomen + -(e)s</text>

  <rect x="260" y="290" width="116" height="108" rx="6" fill="#ffe4e6" stroke="#be123c" stroke-width="2.5"/>
  <text x="318" y="328" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#881337">der / einer</text>
  <text x="318" y="352" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#be123c">keiner</text>
  <text x="318" y="378" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">—</text>

  <rect x="384" y="290" width="116" height="108" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
  <text x="442" y="328" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#14532d">des / eines</text>
  <text x="442" y="352" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#15803d">keines</text>
  <text x="442" y="378" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">Nomen + -(e)s</text>

  <rect x="508" y="290" width="116" height="108" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
  <text x="566" y="328" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#78350f">der / —</text>
  <text x="566" y="352" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#b45309">keiner</text>
  <text x="566" y="378" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">—</text>
</svg>
