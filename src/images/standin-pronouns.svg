<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" role="img" aria-label="Stand-in Cards for Accusative and Dative Personal Pronouns">
  <rect width="640" height="230" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="320" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Stand-in Cards · Personalpronomen</text>

  <!-- Row 1: Singular -->
  <rect x="18" y="46" width="114" height="76" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="75" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">ich</text>
  <text x="75" y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">Akk: mich</text>
  <text x="75" y="111" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#b45309">Dat: mir</text>

  <rect x="142" y="46" width="114" height="76" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="199" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">du</text>
  <text x="199" y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">Akk: dich</text>
  <text x="199" y="111" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#b45309">Dat: dir</text>

  <rect x="266" y="46" width="114" height="76" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="323" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">er (m)</text>
  <text x="323" y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">Akk: ihn</text>
  <text x="323" y="111" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#b45309">Dat: ihm</text>

  <rect x="390" y="46" width="114" height="76" rx="8" fill="#fff1f2" stroke="#be123c" stroke-width="2"/>
  <text x="447" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#881337">sie (f)</text>
  <text x="447" y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">Akk: sie</text>
  <text x="447" y="111" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#b45309">Dat: ihr</text>

  <rect x="514" y="46" width="108" height="76" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="568" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#14532d">es (n)</text>
  <text x="568" y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">Akk: es</text>
  <text x="568" y="111" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#b45309">Dat: ihm</text>

  <!-- Row 2: Plural + Formal -->
  <rect x="80" y="136" width="145" height="76" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="152" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#78350f">wir</text>
  <text x="152" y="182" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">Akk: uns</text>
  <text x="152" y="201" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#b45309">Dat: uns</text>

  <rect x="247" y="136" width="145" height="76" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="320" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#78350f">ihr</text>
  <text x="320" y="182" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">Akk: euch</text>
  <text x="320" y="201" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#b45309">Dat: euch</text>

  <rect x="414" y="136" width="145" height="76" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="486" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#78350f">sie / Sie</text>
  <text x="486" y="182" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">Akk: sie / Sie</text>
  <text x="486" y="201" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#b45309">Dat: ihnen / Ihnen</text>
</svg>
