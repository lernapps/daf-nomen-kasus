<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" role="img" aria-label="Dative and Accusative Arrow Diagram: Sam gives Mina a book">
  <defs>
    <marker id="arrow-dat" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#b45309"/>
    </marker>
    <marker id="arrow-akk" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect width="640" height="210" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Subject: Sam -->
  <rect x="24" y="54" width="136" height="72" rx="10" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
  <text x="92" y="84" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#0f172a">Sam</text>
  <text x="92" y="106" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#475569">Nominativ (Subjekt)</text>

  <!-- Verb -->
  <rect x="190" y="66" width="96" height="48" rx="24" fill="#334155"/>
  <text x="238" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">schenkt</text>

  <!-- Arrow to Dative -->
  <line x1="286" y1="80" x2="348" y2="54" stroke="#b45309" stroke-width="2.5" marker-end="url(#arrow-dat)"/>
  <!-- Arrow to Accusative -->
  <line x1="286" y1="100" x2="348" y2="128" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrow-akk)"/>

  <!-- Recipient: Dative -->
  <rect x="358" y="20" width="258" height="68" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="487" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#78350f">der Schwester / ihr</text>
  <text x="487" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#92400e">Dativ · Wem? (Recipient)</text>

  <!-- Item: Accusative -->
  <rect x="358" y="102" width="258" height="68" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="487" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#1e3a8a">ein Buch / es</text>
  <text x="487" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">Akkusativ · Was? (Thing)</text>

  <!-- Order summary strip -->
  <text x="320" y="194" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#334155">2 Nomen: Dat → Akk  |  1 Pronomen: Pronomen zuerst  |  2 Pronomen: Akk → Dat</text>
</svg>
