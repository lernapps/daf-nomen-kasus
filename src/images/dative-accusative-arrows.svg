<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 256" role="img" aria-label="Dative and Accusative Arrow Diagram: Peter gives his friend a book">
  <defs>
    <marker id="arrow-dat" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#b45309"/>
    </marker>
    <marker id="arrow-akk" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect width="340" height="256" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Subject + Verb top row -->
  <rect x="14" y="16" width="142" height="50" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
  <text x="85" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#0f172a">Peter</text>
  <text x="85" y="56" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#334155">Nominativ (Subjekt)</text>

  <rect x="174" y="21" width="152" height="40" rx="20" fill="#334155"/>
  <text x="250" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">schenkt</text>

  <!-- Arrows down to Dativ and Akkusativ -->
  <line x1="216" y1="61" x2="100" y2="94" stroke="#b45309" stroke-width="2.5" marker-end="url(#arrow-dat)"/>
  <line x1="274" y1="61" x2="254" y2="94" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrow-akk)"/>

  <!-- Recipient: Dative -->
  <rect x="14" y="100" width="152" height="66" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="90" y="122" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#78350f">der Freundin / ihr</text>
  <text x="90" y="141" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#78350f">Dativ · Wem?</text>
  <text x="90" y="157" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#78350f">(Empfänger / Person)</text>

  <!-- Thing: Accusative -->
  <rect x="174" y="100" width="152" height="66" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="250" y="122" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#1e3a8a">ein Spiel / es</text>
  <text x="250" y="141" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1e3a8a">Akkusativ · Was?</text>
  <text x="250" y="157" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#1e3a8a">(Sache / Thing)</text>

  <!-- Summary strip -->
  <rect x="14" y="176" width="312" height="48" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="170" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">2 Nomen: Dat → Akk  ·  1 Pronomen: zuerst</text>
  <text x="170" y="214" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1e3a8a">2 Pronomen: Akk → Dat (es ihr)</text>
</svg>
