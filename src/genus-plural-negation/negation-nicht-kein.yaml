# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title:
  de: "Negation mit nicht und kein"
  en: "Negation with nicht and kein"
description:
  de: "Nomen mit kein/keine und Verben, Adjektive oder ganze Sätze mit nicht verneinen."
  en: "Negate nouns with kein/keine and verbs, adjectives, or full sentences with nicht."
competencies: [negation-nicht-kein]
blocks:
  - type: section
    id: nicht-oder-kein
    title:
      de: "Was fehlt in Peters Zimmer?"
      en: "What Is Missing in Peter's Room?"
    blocks:
      - type: text
        text:
          de: "Peter prüft seine Checkliste in Lindenberg. Im Deutschen gibt es zwei Verneinungswörter: **kein/keine** und **nicht**. Welches Wort du wählst, hängt davon ab, was du verneinst."
          en: "Peter checks his room checklist in Lindenberg. German has two negation words: **kein/keine** and **nicht**. Your choice depends on what you are negating."
      - type: table
        caption:
          de: "kein vs. nicht im Überblick"
          en: "kein vs. nicht at a Glance"
        header:
          - { de: "Wort", en: "Word" }
          - { de: "Verneint …", en: "Negates …" }
          - { de: "Beispiel", en: "Example" }
        rows:
          - - { de: "kein / keine", en: "kein / keine" }
            - { de: "Nomen mit ein/eine oder ohne Artikel", en: "nouns with ein/eine or no article" }
            - { de: "Das ist kein Tisch. Hier sind keine Poster.", en: "Das ist kein Tisch. Hier sind keine Poster." }
          - - { de: "nicht", en: "nicht" }
            - { de: "Verben, Adjektive, bestimmte Artikel, Namen", en: "verbs, adjectives, definite articles, names" }
            - {
                de: "Das Zimmer ist nicht klein. Lukas kommt nicht.",
                en: "Das Zimmer ist nicht klein. Lukas kommt nicht.",
              }
      - type: example
        title:
          de: "Wo steht nicht im Satz?"
          en: "Where Does nicht Go?"
        blocks:
          - type: text
            text:
              de: "Verneinst du ein einzelnes Wort (z. B. ein Adjektiv), steht **nicht direkt davor**: *Der Stuhl ist **nicht** neu.* Verneinst du den ganzen Satz (das Verb), steht **nicht am Satzende**: *Peter schläft heute **nicht**.*"
              en: "When negating a specific word (such as an adjective), **nicht stands directly before it**: *Der Stuhl ist **nicht** neu.* When negating the whole sentence (the verb), **nicht goes to the end**: *Peter schläft heute **nicht**.*"
  - type: section
    id: uebung
    title:
      de: "Übung"
      en: "Practice"
    blocks:
      - type: language-task
        id: negation-wahl
        languages: { source: en, target: de }
        mode: choice
        task:
          de: "Wähle kein, keine oder nicht."
          en: "Choose kein, keine, or nicht."
        items:
          - source: "The room is not small."
            target: "Das Zimmer ist [nicht] klein."
            distractors: [[kein, keine]]
          - source: "That is not a lamp."
            target: "Das ist [keine] Lampe."
            distractors: [[kein, nicht]]
          - source: "That is not a bed."
            target: "Das ist [kein] Bett."
            distractors: [[keine, nicht]]
          - source: "Mina is not coming today."
            target: "Mina kommt heute [nicht]."
            distractors: [[kein, keine]]
        explanation:
          de: "Vor Nomen mit *ein/eine* oder ohne Artikel steht *kein/keine*. Verben und Adjektive verneinst du mit *nicht*."
          en: "Use *kein/keine* before nouns with *ein/eine* or no article. Negate verbs and adjectives with *nicht*."
      - type: single-choice
        id: negation-wortstellung
        text:
          de: "Peter sagt, dass das nicht sein Buch ist. Welcher Satz ist richtig?"
          en: "Peter says that this is not his book (with a definite article). Which sentence is correct?"
        options:
          - text:
              de: "Das ist nicht das Buch von Lukas."
              en: "Das ist nicht das Buch von Lukas."
            correct: true
            info:
              de: "Richtig! Vor einem bestimmten Artikel (*das Buch*) steht immer *nicht*, niemals *kein*."
              en: "Correct! Before a definite article (*das Buch*), always use *nicht*, never *kein*."
          - text:
              de: "Das ist kein das Buch von Lukas."
              en: "Das ist kein das Buch von Lukas."
            correct: false
            info:
              de: "*kein* ersetzt *ein/eine*, es steht nie zusammen mit *der, die, das*."
              en: "*kein* replaces *ein/eine*; it is never used together with *der, die, das*."
          - text:
              de: "Das ist das Buch von Lukas kein."
              en: "Das ist das Buch von Lukas kein."
            correct: false
            info:
              de: "*kein* steht immer vor einem Nomen, nicht am Satzende."
              en: "*kein* always precedes a noun, never at the end of a sentence."
        explanation:
          de: "Steht vor dem Nomen ein bestimmter Artikel (*der/die/das*), verneinst du mit *nicht* davor."
          en: "When a noun has a definite article (*der/die/das*), negate it with *nicht* in front of it."
