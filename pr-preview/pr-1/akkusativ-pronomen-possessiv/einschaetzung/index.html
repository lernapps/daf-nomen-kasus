<h1>Selbsteinschätzung</h1>
<p class="explainer-assessment-nojs">Die Selbsteinschätzung braucht JavaScript. <a href="../../akkusativ-pronomen-possessiv/">Akkusativ, Pronomen und Possessivartikel</a></p>
<template class="explainer-assessment-template">
<div class="explainer-assessment" hidden>
<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 6 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>
<p class="explainer-assessment-privacy">Dein Ergebnis bleibt nur auf diesem Gerät. Ein neuer Start ersetzt es.</p>
<p><button type="button" class="explainer-assessment-begin">Los geht's</button></p>
</div>
<section class="explainer-assessment-step" data-step="0" aria-labelledby="teil-1" hidden>
<h2 id="teil-1" tabindex="-1">Seite 1 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="explainer-language-text"><p>Ergänze den passenden Artikel im Akkusativ (den, einen, eine, ein, keinen).</p></div><div class="explainer-language-live" hidden></div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="explainer-language-text"><p>Ersetze das Nomen oder die Person durch das richtige Akkusativpronomen.</p></div><div class="explainer-language-live" hidden></div></li>
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="explainer-language-text"><p>Ergänze den Possessivartikel in Peters Gespräch mit Lukas und Mina.</p></div><div class="explainer-language-live" hidden></div></li>
</ol>
<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-next">Weiter</button></p>
</section>
<section class="explainer-assessment-step" data-step="1" aria-labelledby="teil-2" hidden>
<h2 id="teil-2" tabindex="-1">Seite 2 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Aufgabe 4</p><div class="question" id="frage-a4" data-id="a4" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Im Satz *Den Stuhl braucht Peter heute* — was ist das Subjekt im Nominativ?</legend>
<label class="question-option"><input type="radio" name="frage-a4" value="0"> <span>Peter</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="1"> <span>Den Stuhl</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="2"> <span>heute</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Peter</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Richtig! *Den Stuhl* steht zwar vorne, ist aber wegen *den* klar der Akkusativ. *Peter* ist das Subjekt.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Den Stuhl</strong></p><p>*den* zeigt den Akkusativ an. Im Deutschen zeigen die Fälle die Rolle — nicht immer die Wortstellung!</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>heute</strong></p><p>*heute* ist eine Zeitangabe, kein Subjekt.</p></li>
</ul>
<p class="question-explanation">Der Artikel *den* markiert den Akkusativ eindeutig — auch wenn das Objekt vor dem Verb steht.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a5"><p class="explainer-assessment-label">Aufgabe 5</p><div class="question" id="frage-a5" data-id="a5" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Peter sucht seinen Schlüssel (*der Schlüssel*). Warum sagt er *Ich finde ihn* und nicht *Ich finde es*?</legend>
<label class="question-option"><input type="radio" name="frage-a5" value="0"> <span>Weil das Pronomen zum Genus (*der*, maskulin) passt — auch bei Sachen.</span></label>
<label class="question-option"><input type="radio" name="frage-a5" value="1"> <span>Weil *es* im Deutschen nie im Akkusativ stehen darf.</span></label>
<label class="question-option"><input type="radio" name="frage-a5" value="2"> <span>Weil *finden* immer das Pronomen *ihn* verlangt.</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Weil das Pronomen zum Genus (*der*, maskulin) passt — auch bei Sachen.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Genau! Im Deutschen richtet sich das Pronomen nach *der/die/das*, nicht nach Mensch oder Sache.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Weil *es* im Deutschen nie im Akkusativ stehen darf.</strong></p><p>Für neutrale Nomen wie *das Buch* benutzt man sehr wohl *es*: *Ich lese es.*</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Weil *finden* immer das Pronomen *ihn* verlangt.</strong></p><p>*finden* nimmt den Akkusativ, aber das Pronomen hängt vom Nomen ab (*die Tasche → sie*, *das Heft → es*).</p></li>
</ul>
<p class="question-explanation">Auch Dinge tragen ihr grammatisches Geschlecht weiter: *der → ihn*, *die → sie*, *das → es*.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a6"><p class="explainer-assessment-label">Aufgabe 6</p><div class="question" id="frage-a6" data-id="a6" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Lukas und Mina suchen ihren Fußball (*der Ball*, m). Wie fragt Peter richtig?</legend>
<label class="question-option"><input type="radio" name="frage-a6" value="0"> <span>Sucht ihr euren Ball?</span></label>
<label class="question-option"><input type="radio" name="frage-a6" value="1"> <span>Sucht ihr eueren Ball?</span></label>
<label class="question-option"><input type="radio" name="frage-a6" value="2"> <span>Sucht ihr euer Ball?</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Sucht ihr euren Ball?</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Richtig! Maskulin Akkusativ braucht *-en*, und *euer* verliert dabei das zweite *e* → *euren*.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Sucht ihr eueren Ball?</strong></p><p>Sobald *euer* eine Endung bekommt, fällt das zweite *e* weg: *euren Ball*.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Sucht ihr euer Ball?</strong></p><p>*der Ball* ist maskulin im Akkusativ und braucht die Endung *-en*: *euren Ball*.</p></li>
</ul>
<p class="question-explanation">Bei *euer* mit Endung fällt das zweite *e* aus: *eure* (f/pl), *euren* (m Akk.).</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
