<h1>Self-assessment</h1>
<p class="explainer-assessment-nojs">The self-assessment needs JavaScript. <a href="../../../en/akkusativ-pronomen-possessiv/">Accusative, Pronouns and Possessives</a></p>
<template class="explainer-assessment-template">
<div class="explainer-assessment" hidden>
<div class="explainer-assessment-intro">
<p>With this self-assessment, 6 tasks give you an overview of what you know already. It asks about every page.</p>
<p>The app does not tell you for each task whether it is right. Only at the end do you see for each page asked whether you know it already. What you leave empty counts as not known.</p>
<p class="explainer-assessment-privacy">Your result stays on this device only. A new start replaces it.</p>
<p><button type="button" class="explainer-assessment-begin">Let's go</button></p>
</div>
<section class="explainer-assessment-step" data-step="0" aria-labelledby="teil-1" hidden>
<h2 id="teil-1" tabindex="-1">Page 1 of 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Task 1</p><div class="explainer-language-text"><p>Fill in the right accusative article (den, einen, eine, ein, keinen).</p></div><div class="explainer-language-live" hidden></div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Task 2</p><div class="explainer-language-text"><p>Replace the noun or person with the right accusative pronoun.</p></div><div class="explainer-language-live" hidden></div></li>
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Task 3</p><div class="explainer-language-text"><p>Fill in the possessive determiner in Peter&#39;s conversation with Lukas and Mina.</p></div><div class="explainer-language-live" hidden></div></li>
</ol>
<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-next">Next</button></p>
</section>
<section class="explainer-assessment-step" data-step="1" aria-labelledby="teil-2" hidden>
<h2 id="teil-2" tabindex="-1">Page 2 of 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Task 4</p><div class="question" id="frage-a4" data-id="a4" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">In the sentence *Den Stuhl braucht Peter heute* — what is the nominative subject?</legend>
<label class="question-option"><input type="radio" name="frage-a4" value="0"> <span>Peter</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="1"> <span>Den Stuhl</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="2"> <span>heute</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Peter</strong> <span class="question-badge question-badge-right">right answer</span></p><p>Correct! Even though *Den Stuhl* stands first, *den* marks it as accusative. *Peter* is the subject.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Den Stuhl</strong></p><p>*den* marks the accusative case. In German, cases show grammatical role — not always word order!</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>heute</strong></p><p>*heute* is a time adverb, not a subject.</p></li>
</ul>
<p class="question-explanation">The article *den* clearly marks the accusative — even when the object stands before the verb.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a5"><p class="explainer-assessment-label">Task 5</p><div class="question" id="frage-a5" data-id="a5" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Peter is looking for his key (*der Schlüssel*). Why does he say *Ich finde ihn* instead of *Ich finde es*?</legend>
<label class="question-option"><input type="radio" name="frage-a5" value="0"> <span>Because the pronoun matches the noun's gender (*der*, masculine) — even for things.</span></label>
<label class="question-option"><input type="radio" name="frage-a5" value="1"> <span>Because *es* can never be used in the accusative in German.</span></label>
<label class="question-option"><input type="radio" name="frage-a5" value="2"> <span>Because *finden* always requires the pronoun *ihn*.</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Because the pronoun matches the noun's gender (*der*, masculine) — even for things.</strong> <span class="question-badge question-badge-right">right answer</span></p><p>Exactly! In German, pronouns follow *der/die/das*, not whether something is a person or a thing.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Because *es* can never be used in the accusative in German.</strong></p><p>For neuter nouns like *das Buch*, you do use *es*: *Ich lese es.*</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Because *finden* always requires the pronoun *ihn*.</strong></p><p>*finden* takes the accusative, but the pronoun depends on the noun (*die Tasche → sie*, *das Heft → es*).</p></li>
</ul>
<p class="question-explanation">Things keep their grammatical gender in pronouns too: *der → ihn*, *die → sie*, *das → es*.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a6"><p class="explainer-assessment-label">Task 6</p><div class="question" id="frage-a6" data-id="a6" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Lukas and Mina are looking for their football (*der Ball*, m). How does Peter ask correctly?</legend>
<label class="question-option"><input type="radio" name="frage-a6" value="0"> <span>Sucht ihr euren Ball?</span></label>
<label class="question-option"><input type="radio" name="frage-a6" value="1"> <span>Sucht ihr eueren Ball?</span></label>
<label class="question-option"><input type="radio" name="frage-a6" value="2"> <span>Sucht ihr euer Ball?</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Sucht ihr euren Ball?</strong> <span class="question-badge question-badge-right">right answer</span></p><p>Correct! Masculine accusative needs *-en*, and *euer* drops its second *e* → *euren*.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Sucht ihr eueren Ball?</strong></p><p>Whenever *euer* takes an ending, the second *e* drops: *euren Ball*.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Sucht ihr euer Ball?</strong></p><p>*der Ball* is masculine accusative and needs the *-en* ending: *euren Ball*.</p></li>
</ul>
<p class="question-explanation">With an ending, *euer* drops its second *e*: *eure* (f/pl), *euren* (m acc.).</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Check</button></p>
</form>
</div></li>
</ol>
