<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Aufgabe 4</p><div class="question" id="frage-a4" data-id="a4" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Peter kauft in Lindenberg ein Brötchen und sieht eine Zeitung. Welches Paar stimmt?</legend>
<label class="question-option"><input type="radio" name="frage-a4" value="0"> <span>das Brötchen (n) · die Zeitung (f)</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="1"> <span>der Brötchen (m) · die Zeitung (f)</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="2"> <span>das Brötchen (n) · der Zeitung (m)</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>das Brötchen (n) · die Zeitung (f)</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Genau! Nomen auf *-chen* sind immer neutrum (*das*), Nomen auf *-ung* immer feminin (*die*).</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>der Brötchen (m) · die Zeitung (f)</strong></p><p>*die Zeitung* stimmt, aber *-chen* macht Nomen immer neutrum: *das Brötchen*.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>das Brötchen (n) · der Zeitung (m)</strong></p><p>*das Brötchen* stimmt, aber Nomen auf *-ung* sind immer feminin: *die Zeitung*.</p></li>
</ul>
<p class="question-explanation">Endungen wie *-chen* (neutrum) und *-ung* (feminin) zeigen das Genus zuverlässig an.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a5"><p class="explainer-assessment-label">Aufgabe 5</p><div class="question" id="frage-a5" data-id="a5" data-type="multiple-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welche dieser Nomen bleiben im Plural ohne neue Endung (Endung —)?</legend>
<label class="question-option"><input type="checkbox" name="frage-a5" value="0"> <span>das Brötchen → die Brötchen</span></label>
<label class="question-option"><input type="checkbox" name="frage-a5" value="1"> <span>der Lehrer → die Lehrer</span></label>
<label class="question-option"><input type="checkbox" name="frage-a5" value="2"> <span>die Schule → die Schulen</span></label>
<label class="question-option"><input type="checkbox" name="frage-a5" value="3"> <span>das Buch → die Bücher</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>das Brötchen → die Brötchen</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Richtig! Nomen auf *-chen* bleiben im Plural unverändert.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>der Lehrer → die Lehrer</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Richtig! Viele Nomen auf *-er* bekommen im Plural keine zusätzliche Endung.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>die Schule → die Schulen</strong></p><p>*die Schule* bekommt ein *-n*: *die Schulen*.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>das Buch → die Bücher</strong></p><p>*das Buch* bekommt Umlaut und *-er*: *die Bücher*.</p></li>
</ul>
<p class="question-explanation">Nomen auf *-er, -el, -en, -chen* bleiben im Plural oft ohne Endung (*die Lehrer, die Brötchen, die Zimmer*).</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a6"><p class="explainer-assessment-label">Aufgabe 6</p><div class="question" id="frage-a6" data-id="a6" data-type="ordering">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Bringe die Wörter in die richtige Reihenfolge: *Peter has no homework today.*</legend>

<ul class="question-pairs">
<li><label><span>keine</span> <select name="frage-a6-3" data-item="3"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option><option value="4">Platz 5</option></select></label></li>
<li><label><span>Hausaufgaben.</span> <select name="frage-a6-4" data-item="4"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option><option value="4">Platz 5</option></select></label></li>
<li><label><span>heute</span> <select name="frage-a6-2" data-item="2"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option><option value="4">Platz 5</option></select></label></li>
<li><label><span>hat</span> <select name="frage-a6-1" data-item="1"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option><option value="4">Platz 5</option></select></label></li>
<li><label><span>Peter</span> <select name="frage-a6-0" data-item="0"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option><option value="4">Platz 5</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> 1. Peter, 2. hat, 3. heute, 4. keine, 5. Hausaufgaben.</p>
<p class="question-explanation">*keine* steht direkt vor dem Pluralnomen *Hausaufgaben*, und das Verb *hat* bleibt an Position 2.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>

<section class="explainer-assessment-step" data-step="3" aria-labelledby="teil-4" hidden>
<h2 id="teil-4" tabindex="-1">Seite 4 von 7</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a10"><p class="explainer-assessment-label">Aufgabe 10</p><div class="question" id="frage-a10" data-id="a10" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Im Satz *Den Stuhl braucht Peter heute* — was ist das Subjekt im Nominativ?</legend>
<label class="question-option"><input type="radio" name="frage-a10" value="0"> <span>Peter</span></label>
<label class="question-option"><input type="radio" name="frage-a10" value="1"> <span>Den Stuhl</span></label>
<label class="question-option"><input type="radio" name="frage-a10" value="2"> <span>heute</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Peter</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Richtig! *Den Stuhl* steht zwar vorne, ist aber wegen *den* klar der Akkusativ. *Peter* ist das Subjekt.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Den Stuhl</strong></p><p>*den* zeigt den Akkusativ an. Im Deutschen zeigen die Fälle die Rolle — nicht immer die Wortstellung!</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>heute</strong></p><p>*heute* ist eine Zeitangabe, kein Subjekt.</p></li>
</ul>
<p class="question-explanation">Der Artikel *den* markiert den Akkusativ eindeutig — auch wenn das Objekt vor dem Verb steht.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a11"><p class="explainer-assessment-label">Aufgabe 11</p><div class="question" id="frage-a11" data-id="a11" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Peter sucht seinen Schlüssel (*der Schlüssel*). Warum sagt er *Ich finde ihn* und nicht *Ich finde es*?</legend>
<label class="question-option"><input type="radio" name="frage-a11" value="0"> <span>Weil das Pronomen zum Genus (*der*, maskulin) passt — auch bei Sachen.</span></label>
<label class="question-option"><input type="radio" name="frage-a11" value="1"> <span>Weil *es* im Deutschen nie im Akkusativ stehen darf.</span></label>
<label class="question-option"><input type="radio" name="frage-a11" value="2"> <span>Weil *finden* immer das Pronomen *ihn* verlangt.</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Weil das Pronomen zum Genus (*der*, maskulin) passt — auch bei Sachen.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Genau! Im Deutschen richtet sich das Pronomen nach *der/die/das*, nicht nach Mensch oder Sache.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Weil *es* im Deutschen nie im Akkusativ stehen darf.</strong></p><p>Für neutrale Nomen wie *das Buch* benutzt man sehr wohl *es*: *Ich lese es.*</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Weil *finden* immer das Pronomen *ihn* verlangt.</strong></p><p>*finden* nimmt den Akkusativ, aber das Pronomen hängt vom Nomen ab (*die Tasche → sie*, *das Heft → es*).</p></li>
</ul>
<p class="question-explanation">Auch Dinge tragen ihr grammatisches Geschlecht weiter: *der → ihn*, *die → sie*, *das → es*.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a12"><p class="explainer-assessment-label">Aufgabe 12</p><div class="question" id="frage-a12" data-id="a12" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Lukas und Mina suchen ihren Fußball (*der Ball*, m). Wie fragt Peter richtig?</legend>
<label class="question-option"><input type="radio" name="frage-a12" value="0"> <span>Sucht ihr euren Ball?</span></label>
<label class="question-option"><input type="radio" name="frage-a12" value="1"> <span>Sucht ihr eueren Ball?</span></label>
<label class="question-option"><input type="radio" name="frage-a12" value="2"> <span>Sucht ihr euer Ball?</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Sucht ihr euren Ball?</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Richtig! Maskulin Akkusativ braucht *-en*, und *euer* verliert dabei das zweite *e* → *euren*.</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Sucht ihr eueren Ball?</strong></p><p>Sobald *euer* eine Endung bekommt, fällt das zweite *e* weg: *euren Ball*.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Sucht ihr euer Ball?</strong></p><p>*der Ball* ist maskulin im Akkusativ und braucht die Endung *-en*: *euren Ball*.</p></li>
</ul>
<p class="question-explanation">Bei *euer* mit Endung fällt das zweite *e* aus: *eure* (f/pl), *euren* (m Akk.).</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>

<h2 id="teil-7" tabindex="-1">Seite 7 von 7</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a20"><p class="explainer-assessment-label">Aufgabe 20</p><div class="explainer-language-text"><p>Ergänze Artikel und Nomen im Genitiv (achte auf -(e)s bei Maskulin/Neutrum).</p></div><div class="explainer-language-live" hidden></div></li>
<li class="explainer-assessment-item" data-key="a21"><p class="explainer-assessment-label">Aufgabe 21</p><div class="question" id="frage-a21" data-id="a21" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Wie nennt Peter richtig das Zimmer seines Freundes (*mein Freund*, m)?</legend>
<label class="question-option"><input type="radio" name="frage-a21" value="0"> <span>Das ist das Zimmer meines Freundes.</span></label>
<label class="question-option"><input type="radio" name="frage-a21" value="1"> <span>Das ist das Zimmer meinem Freund.</span></label>
<label class="question-option"><input type="radio" name="frage-a21" value="2"> <span>Das ist das Zimmer meines Freund.</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Das ist das Zimmer meines Freundes.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Richtig! Possessivartikel *meines* (Genitiv m) + Nomen *Freundes* (+ *-es*).</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Das ist das Zimmer meinem Freund.</strong></p><p>*meinem* ist Dativ. Für direkten Besitz ohne Präposition braucht man den Genitiv: *meines Freundes*.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Das ist das Zimmer meines Freund.</strong></p><p>Am maskulinen Nomen fehlt die Genitiv-Endung *-es*: *meines Freundes*.</p></li>
</ul>
<p class="question-explanation">Im Genitiv bekommen sowohl Artikel/Possessivartikel (*des/meines*) als auch maskuline und neutrale Nomen ein *-(e)s*.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a22"><p class="explainer-assessment-label">Aufgabe 22</p><div class="explainer-language-text"><p>Ergänze die richtige Form des schwachen maskulinen Nomens.</p></div><div class="explainer-language-live" hidden></div></li>
<li class="explainer-assessment-item" data-key="a23"><p class="explainer-assessment-label">Aufgabe 23</p><div class="question" id="frage-a23" data-id="a23" data-type="multiple-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welche Aussagen über die n-Deklination stimmen?</legend>
<label class="question-option"><input type="checkbox" name="frage-a23" value="0"> <span>Sie gilt nur für bestimmte maskuline Nomen.</span></label>
<label class="question-option"><input type="checkbox" name="frage-a23" value="1"> <span>Nur im Nominativ Singular steht die Grundform ohne -n/-en.</span></label>
<label class="question-option"><input type="checkbox" name="frage-a23" value="2"> <span>Alle maskulinen Nomen bekommen im Akkusativ ein -n.</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Sie gilt nur für bestimmte maskuline Nomen.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Richtig! Feminine und neutrale Nomen (außer dem Sonderfall *das Herz*) gehören nicht dazu.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>Nur im Nominativ Singular steht die Grundform ohne -n/-en.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Richtig! In Akkusativ, Dativ, Genitiv und Plural steht *-n* oder *-en*.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Alle maskulinen Nomen bekommen im Akkusativ ein -n.</strong></p><p>Nein, normale maskuline Nomen wie *der Tisch* oder *der Lehrer* bleiben im Akkusativ unverändert (*den Tisch, den Lehrer*).</p></li>
</ul>
<p class="question-explanation">Die n-Deklination betrifft eine klar begrenzte Gruppe maskuliner Nomen und fügt in allen Fällen außer Nominativ Singular *-n/-en* hinzu.</p>
</div>
