<main class="explainer" id="inhalt-der-seite">
<h1>Selbsteinschätzung</h1>
<p class="explainer-assessment-nojs">Die Selbsteinschätzung braucht JavaScript. <a href="../../genus-plural-negation/">Genus, Plural und Negation</a></p>
<template class="explainer-assessment-template">
<div class="explainer-assessment" hidden>
<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 6 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>
<p class="explainer-assessment-privacy">Dein Ergebnis bleibt nur auf diesem Gerät. Ein neuer Start ersetzt es.</p>
<p><button type="button" class="explainer-assessment-begin">Los geht's</button></p>
</div>
<section class="explainer-assessment-step" data-step="0" aria-labelledby="teil-1" hidden>
<h2 id="teil-1" tabindex="-1">Seite 1 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="explainer-language-text"><p>Ergänze den passenden Artikel (<em>ein, eine, der, die, das</em>) im Nominativ.</p></div><div class="explainer-language-live" hidden></div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="explainer-language-text"><p>Schreibe die passende Pluralform mit dem Artikel die in die Lücke.</p></div><div class="explainer-language-live" hidden></div></li>
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="explainer-language-text"><p>Schreibe <em>kein</em>, <em>keine</em> oder <em>nicht</em> in die Lücke.</p></div><div class="explainer-language-live" hidden></div></li>
</ol>
<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-next">Weiter</button></p>
</section>
<section class="explainer-assessment-step" data-step="1" aria-labelledby="teil-2" hidden>
<h2 id="teil-2" tabindex="-1">Seite 2 von 2</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Aufgabe 4</p><div class="question" id="frage-a4" data-id="a4" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Peter kauft in Lindenberg ein Brötchen und sieht eine Zeitung. Welches Paar stimmt?</legend>
<label class="question-option"><input type="radio" name="frage-a4" value="0"> <span>das Brötchen (n) · die Zeitung (f)</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="1"> <span>der Brötchen (m) · die Zeitung (f)</span></label>
<label class="question-option"><input type="radio" name="frage-a4" value="2"> <span>das Brötchen (n) · der Zeitung (m)</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>das Brötchen (n) · die Zeitung (f)</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Genau! Nomen auf *-chen* sind immer neutrum (*das*), Nomen auf *-ung* immer feminin (*die*).</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>der Brötchen (m) · die Zeitung (f)</strong></p><p>*die Zeitung* stimmt, aber *-chen* macht Nomen immer neutrum: *das Brötchen*.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>das Brötchen (n) · der Zeitung (m)</strong></p><p>*das Brötchen* stimmt, aber Nomen auf *-ung* sind immer feminin: *die Zeitung*.</p></li>
</ul>
<p class="question-explanation">Endungen wie *-chen* (neutrum) und *-ung* (feminin) zeigen das Genus zuverlässig an.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a5"><p class="explainer-assessment-label">Aufgabe 5</p><div class="question" id="frage-a5" data-id="a5" data-type="multiple-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welche dieser Nomen bleiben im Plural ohne neue Endung (Endung —)?</legend>
<label class="question-option"><input type="checkbox" name="frage-a5" value="0"> <span>das Brötchen → die Brötchen</span></label>
<label class="question-option"><input type="checkbox" name="frage-a5" value="1"> <span>der Lehrer → die Lehrer</span></label>
<label class="question-option"><input type="checkbox" name="frage-a5" value="2"> <span>die Schule → die Schulen</span></label>
<label class="question-option"><input type="checkbox" name="frage-a5" value="3"> <span>das Buch → die Bücher</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>das Brötchen → die Brötchen</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Richtig! Nomen auf *-chen* bleiben im Plural unverändert.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>der Lehrer → die Lehrer</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Richtig! Viele Nomen auf *-er* bekommen im Plural keine zusätzliche Endung.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>die Schule → die Schulen</strong></p><p>*die Schule* bekommt ein *-n*: *die Schulen*.</p></li>
<li class="question-info" data-option="3"><p class="question-info-head"><strong>das Buch → die Bücher</strong></p><p>*das Buch* bekommt Umlaut und *-er*: *die Bücher*.</p></li>
</ul>
<p class="question-explanation">Nomen auf *-er, -el, -en, -chen* bleiben im Plural oft ohne Endung (*die Lehrer, die Brötchen, die Zimmer*).</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a6"><p class="explainer-assessment-label">Aufgabe 6</p><div class="question" id="frage-a6" data-id="a6" data-type="ordering">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Bringe die Wörter in die richtige Reihenfolge: *Peter has no homework today.*</legend>
<p class="question-hint">Gib jedem Eintrag seinen Platz: 1 für den ersten.</p>
<ul class="question-pairs">
<li><label><span>keine</span> <select name="frage-a6-3" data-item="3"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option><option value="4">Platz 5</option></select></label></li>
<li><label><span>Hausaufgaben.</span> <select name="frage-a6-4" data-item="4"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option><option value="4">Platz 5</option></select></label></li>
<li><label><span>heute</span> <select name="frage-a6-2" data-item="2"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option><option value="4">Platz 5</option></select></label></li>
<li><label><span>hat</span> <select name="frage-a6-1" data-item="1"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option><option value="4">Platz 5</option></select></label></li>
<li><label><span>Peter</span> <select name="frage-a6-0" data-item="0"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option><option value="4">Platz 5</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> 1. Peter, 2. hat, 3. heute, 4. keine, 5. Hausaufgaben.</p>
<p class="question-explanation">*keine* steht direkt vor dem Pluralnomen *Hausaufgaben*, und das Verb *hat* bleibt an Position 2.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
