<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-label="4-Case Color Table: Nominative, Accusative, and Dative">
  <rect width="640" height="330" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Headers -->
  <rect x="16" y="16" width="112" height="36" rx="6" fill="#334155"/>
  <text x="72" y="39" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Kasus / Case</text>
  <rect x="136" y="16" width="116" height="36" rx="6" fill="#1d4ed8"/>
  <text x="194" y="39" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">m (Mask.)</text>
  <rect x="260" y="16" width="116" height="36" rx="6" fill="#be123c"/>
  <text x="318" y="39" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">f (Fem.)</text>
  <rect x="384" y="16" width="116" height="36" rx="6" fill="#15803d"/>
  <text x="442" y="39" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">n (Neutr.)</text>
  <rect x="508" y="16" width="116" height="36" rx="6" fill="#b45309"/>
  <text x="566" y="39" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">pl (Plural)</text>

  <!-- Row 1: Nominativ -->
  <rect x="16" y="62" width="112" height="68" rx="6" fill="#e2e8f0"/>
  <text x="72" y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Nominativ</text>
  <text x="72" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Subjekt</text>

  <rect x="136" y="62" width="116" height="68" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="194" y="91" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e3a8a">der / ein</text>
  <text x="194" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1d4ed8">kein</text>

  <rect x="260" y="62" width="116" height="68" rx="6" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5"/>
  <text x="318" y="91" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#881337">die / eine</text>
  <text x="318" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#be123c">keine</text>

  <rect x="384" y="62" width="116" height="68" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="442" y="91" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#14532d">das / ein</text>
  <text x="442" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#15803d">kein</text>

  <rect x="508" y="62" width="116" height="68" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="566" y="91" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#78350f">die / —</text>
  <text x="566" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#b45309">keine</text>

  <!-- Row 2: Akkusativ -->
  <rect x="16" y="140" width="112" height="68" rx="6" fill="#e2e8f0"/>
  <text x="72" y="170" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Akkusativ</text>
  <text x="72" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Wen? / Was?</text>

  <rect x="136" y="140" width="116" height="68" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="194" y="169" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e3a8a">den / einen</text>
  <text x="194" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1d4ed8">keinen</text>

  <rect x="260" y="140" width="116" height="68" rx="6" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5"/>
  <text x="318" y="169" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#881337">die / eine</text>
  <text x="318" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#be123c">keine</text>

  <rect x="384" y="140" width="116" height="68" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="442" y="169" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#14532d">das / ein</text>
  <text x="442" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#15803d">kein</text>

  <rect x="508" y="140" width="116" height="68" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="566" y="169" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#78350f">die / —</text>
  <text x="566" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#b45309">keine</text>

  <!-- Row 3: Dativ (NEW) -->
  <rect x="16" y="218" width="112" height="94" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
  <text x="72" y="255" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#78350f">Dativ</text>
  <text x="72" y="276" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#92400e">Wem?</text>
  <text x="72" y="297" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#b91c1c">★ NEW</text>

  <rect x="136" y="218" width="116" height="94" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="194" y="252" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#1e3a8a">dem / einem</text>
  <text x="194" y="274" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">keinem</text>
  <text x="194" y="296" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">-m</text>

  <rect x="260" y="218" width="116" height="94" rx="6" fill="#ffe4e6" stroke="#be123c" stroke-width="2.5"/>
  <text x="318" y="252" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#881337">der / einer</text>
  <text x="318" y="274" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#be123c">keiner</text>
  <text x="318" y="296" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">-r</text>

  <rect x="384" y="218" width="116" height="94" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
  <text x="442" y="252" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#14532d">dem / einem</text>
  <text x="442" y="274" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#15803d">keinem</text>
  <text x="442" y="296" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">-m</text>

  <rect x="508" y="218" width="116" height="94" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
  <text x="566" y="252" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#78350f">den / —</text>
  <text x="566" y="274" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#b45309">keinen</text>
  <text x="566" y="296" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">Nomen + -n</text>
