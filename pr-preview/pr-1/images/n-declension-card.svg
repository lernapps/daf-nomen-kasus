<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 205" role="img" aria-label="Weak Masculine Nouns (n-declension) Pattern Card">
  <rect width="640" height="205" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="16" y="16" width="608" height="36" rx="6" fill="#1d4ed8"/>
  <text x="320" y="39" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">n-Deklination · Pattern Card (Maskulinum)</text>

  <!-- Nominative (no -n) -->
  <rect x="16" y="66" width="142" height="120" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="87" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#475569">Nominativ (Sg.)</text>
  <text x="87" y="122" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#1e3a8a">der Kollege</text>
  <text x="87" y="146" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e3a8a">der Mensch</text>
  <text x="87" y="172" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Grundform</text>

  <!-- Akk, Dat, Gen (+ -n/-en) -->
  <rect x="172" y="66" width="142" height="120" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="243" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">Akkusativ</text>
  <text x="243" y="122" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#1e3a8a">den Kollegen</text>
  <text x="243" y="146" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e3a8a">den Menschen</text>
  <text x="243" y="172" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">+ -n / -en</text>

  <rect x="328" y="66" width="142" height="120" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
  <text x="399" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#92400e">Dativ</text>
  <text x="399" y="122" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#78350f">dem Kollegen</text>
  <text x="399" y="146" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#78350f">dem Menschen</text>
  <text x="399" y="172" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">+ -n / -en</text>

  <rect x="484" y="66" width="140" height="120" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2.5"/>
  <text x="554" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#5b21b6">Genitiv</text>
  <text x="554" y="122" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#4c1d95">des Kollegen</text>
  <text x="554" y="146" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#4c1d95">des Menschen</text>
  <text x="554" y="172" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">+ -n / -en</text>
</svg>
