<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 245" role="img" aria-label="4-Case Color Table: Nominative and Accusative">
  <rect width="640" height="245" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Headers -->
  <rect x="16" y="16" width="112" height="38" rx="6" fill="#334155"/>
  <text x="72" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Kasus / Case</text>
  <rect x="136" y="16" width="116" height="38" rx="6" fill="#1d4ed8"/>
  <text x="194" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">m (Mask.)</text>
  <rect x="260" y="16" width="116" height="38" rx="6" fill="#be123c"/>
  <text x="318" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">f (Fem.)</text>
  <rect x="384" y="16" width="116" height="38" rx="6" fill="#15803d"/>
  <text x="442" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">n (Neutr.)</text>
  <rect x="508" y="16" width="116" height="38" rx="6" fill="#b45309"/>
  <text x="566" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">pl (Plural)</text>

  <!-- Row 1: Nominativ -->
  <rect x="16" y="64" width="112" height="70" rx="6" fill="#e2e8f0"/>
  <text x="72" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Nominativ</text>
  <text x="72" y="116" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Subjekt</text>

  <rect x="136" y="64" width="116" height="70" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="194" y="94" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e3a8a">der / ein</text>
  <text x="194" y="116" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#1d4ed8">kein</text>

  <rect x="260" y="64" width="116" height="70" rx="6" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5"/>
  <text x="318" y="94" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#881337">die / eine</text>
  <text x="318" y="116" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#be123c">keine</text>

  <rect x="384" y="64" width="116" height="70" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="442" y="94" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#14532d">das / ein</text>
  <text x="442" y="116" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#15803d">kein</text>

  <rect x="508" y="64" width="116" height="70" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="566" y="94" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#78350f">die / —</text>
  <text x="566" y="116" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#b45309">keine</text>

  <!-- Row 2: Akkusativ -->
  <rect x="16" y="144" width="112" height="84" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="72" y="178" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e3a8a">Akkusativ</text>
  <text x="72" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#1d4ed8">Wen? / Was?</text>

  <!-- Masculine CHANGE highlighted -->
  <rect x="136" y="144" width="116" height="84" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/>
  <text x="194" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="800" fill="#1e3a8a">den / einen</text>
  <text x="194" y="197" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">keinen</text>
  <text x="194" y="217" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#b91c1c">★ NEW (-n)</text>

  <rect x="260" y="144" width="116" height="84" rx="6" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5"/>
  <text x="318" y="182" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#881337">die / eine</text>
  <text x="318" y="204" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#be123c">keine</text>

  <rect x="384" y="144" width="116" height="84" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="442" y="182" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#14532d">das / ein</text>
  <text x="442" y="204" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#15803d">kein</text>

  <rect x="508" y="144" width="116" height="84" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="566" y="182" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#78350f">die / —</text>
  <text x="566" y="204" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#b45309">keine</text>
</svg>
