<h1>Selbsteinschätzung</h1>
<p class="explainer-assessment-nojs">Die Selbsteinschätzung braucht JavaScript. <a href="../../genitiv-n-deklination/">Genitiv und n-Deklination</a></p>
<template class="explainer-assessment-template">
<div class="explainer-assessment" hidden>
<div class="explainer-assessment-intro">
<p>Mit dieser Selbsteinschätzung bekommst du mit 4 Aufgaben einen Überblick, was du schon kannst. Sie fragt jede Seite ab.</p>
<p>Die App sagt dir nicht bei jeder Aufgabe, ob sie stimmt. Erst am Ende siehst du für jede abgefragte Seite, ob du sie schon kannst. Was du leer lässt, zählt als nicht gekonnt.</p>
<p class="explainer-assessment-privacy">Dein Ergebnis bleibt nur auf diesem Gerät. Ein neuer Start ersetzt es.</p>
<p><button type="button" class="explainer-assessment-begin">Los geht's</button></p>
</div>
<section class="explainer-assessment-step" data-step="0" aria-labelledby="teil-1" hidden>
<h2 id="teil-1" tabindex="-1">Seite 1 von 1</h2>
<ol class="explainer-assessment-items">
<li class="explainer-assessment-item" data-key="a1"><p class="explainer-assessment-label">Aufgabe 1</p><div class="explainer-language-text"><p>Ergänze Artikel und Nomen im Genitiv (achte auf -(e)s bei Maskulin/Neutrum).</p></div><div class="explainer-language-live" hidden></div></li>
<li class="explainer-assessment-item" data-key="a2"><p class="explainer-assessment-label">Aufgabe 2</p><div class="question" id="frage-a2" data-id="a2" data-type="single-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Wie nennt Peter richtig das Zimmer seines Freundes (*mein Freund*, m)?</legend>
<label class="question-option"><input type="radio" name="frage-a2" value="0"> <span>Das ist das Zimmer meines Freundes.</span></label>
<label class="question-option"><input type="radio" name="frage-a2" value="1"> <span>Das ist das Zimmer meinem Freund.</span></label>
<label class="question-option"><input type="radio" name="frage-a2" value="2"> <span>Das ist das Zimmer meines Freund.</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Das ist das Zimmer meines Freundes.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Richtig! Possessivartikel *meines* (Genitiv m) + Nomen *Freundes* (+ *-es*).</p></li>
<li class="question-info" data-option="1"><p class="question-info-head"><strong>Das ist das Zimmer meinem Freund.</strong></p><p>*meinem* ist Dativ. Für direkten Besitz ohne Präposition braucht man den Genitiv: *meines Freundes*.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Das ist das Zimmer meines Freund.</strong></p><p>Am maskulinen Nomen fehlt die Genitiv-Endung *-es*: *meines Freundes*.</p></li>
</ul>
<p class="question-explanation">Im Genitiv bekommen sowohl Artikel/Possessivartikel (*des/meines*) als auch maskuline und neutrale Nomen ein *-(e)s*.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
<li class="explainer-assessment-item" data-key="a3"><p class="explainer-assessment-label">Aufgabe 3</p><div class="explainer-language-text"><p>Ergänze die richtige Form des schwachen maskulinen Nomens.</p></div><div class="explainer-language-live" hidden></div></li>
<li class="explainer-assessment-item" data-key="a4"><p class="explainer-assessment-label">Aufgabe 4</p><div class="question" id="frage-a4" data-id="a4" data-type="multiple-choice">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welche Aussagen über die n-Deklination stimmen?</legend>
<label class="question-option"><input type="checkbox" name="frage-a4" value="0"> <span>Sie gilt nur für bestimmte maskuline Nomen.</span></label>
<label class="question-option"><input type="checkbox" name="frage-a4" value="1"> <span>Nur im Nominativ Singular steht die Grundform ohne -n/-en.</span></label>
<label class="question-option"><input type="checkbox" name="frage-a4" value="2"> <span>Alle maskulinen Nomen bekommen im Akkusativ ein -n.</span></label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<ul class="question-infos">
<li class="question-info question-info-right" data-option="0"><p class="question-info-head"><strong>Sie gilt nur für bestimmte maskuline Nomen.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Richtig! Feminine und neutrale Nomen (außer dem Sonderfall *das Herz*) gehören nicht dazu.</p></li>
<li class="question-info question-info-right" data-option="1"><p class="question-info-head"><strong>Nur im Nominativ Singular steht die Grundform ohne -n/-en.</strong> <span class="question-badge question-badge-right">richtige Antwort</span></p><p>Richtig! In Akkusativ, Dativ, Genitiv und Plural steht *-n* oder *-en*.</p></li>
<li class="question-info" data-option="2"><p class="question-info-head"><strong>Alle maskulinen Nomen bekommen im Akkusativ ein -n.</strong></p><p>Nein, normale maskuline Nomen wie *der Tisch* oder *der Lehrer* bleiben im Akkusativ unverändert (*den Tisch, den Lehrer*).</p></li>
</ul>
<p class="question-explanation">Die n-Deklination betrifft eine klar begrenzte Gruppe maskuliner Nomen und fügt in allen Fällen außer Nominativ Singular *-n/-en* hinzu.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>
</ol>
<p class="explainer-assessment-nav"><button type="button" class="explainer-assessment-finish">Auswerten</button></p>
</section>
